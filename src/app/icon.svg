<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#000"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="4.5"
        fill="none" stroke="#4ade80" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- JJ_ -->
  <text
    x="16"
    y="22"
    font-family="'Courier New', Courier, monospace"
    font-size="12"
    font-weight="bold"
    fill="#4ade80"
    text-anchor="middle"
    filter="url(#glow)"
  >JJ_</text>
</svg>
